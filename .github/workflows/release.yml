name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout aloe-desktop
        uses: actions/checkout@v4
        with:
          path: aloe-desktop
          # Full history and tags: the release notes are built from the commits
          # between the previous tag and this one.
          fetch-depth: 0

      # The release body is generated from the commits that landed since the last
      # tag, so cutting a release needs no hand-written notes. Commit subjects are
      # the source, so keep them readable — they are what users read in the update
      # modal.
      - name: Build the release notes
        id: notes
        shell: bash
        working-directory: aloe-desktop
        run: |
          # The release this one follows: the nearest tag at or before the commit
          # being released. Unlike sorting tag names, this stays right when an old
          # tag is rebuilt.
          previous="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -z "${previous}" ]; then
            range="HEAD"
            heading="## What's in this release"
          else
            range="${previous}..HEAD"
            heading="## What changed since ${previous}"
          fi
          # The version-bump commit repeats the release itself, so it is dropped
          # when other commits describe the release. When it is the only commit,
          # its own description becomes the note instead of an empty body.
          body="$(git log "${range}" --no-merges --pretty=format:'- %s' \
            | grep -v -E '^- Release [0-9]+\.[0-9]+\.[0-9]+' || true)"
          if [ -z "${body}" ]; then
            subject="$(git log "${range}" --no-merges -n 1 --pretty=format:'%s')"
            if [ -n "${subject}" ]; then
              summary="${subject#*: }"
              # Capitalise without bash 4's ${var^}: macOS runners still ship bash 3.2.
              first="$(printf '%s' "${summary}" | cut -c1 | tr '[:lower:]' '[:upper:]')"
              rest="$(printf '%s' "${summary}" | cut -c2-)"
              body="- ${first}${rest}"
            fi
          fi
          {
            echo "${heading}"
            echo
            printf '%s\n' "${body}"
          } > release-notes.md
          {
            echo 'body<<ALOE_RELEASE_NOTES'
            cat release-notes.md
            echo 'ALOE_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"
          echo "----- release notes -----"
          cat release-notes.md

      # @aloe/ui (the shared app UI) is a private git dependency; this read-only
      # deploy key lets `bun install` fetch it.
      - name: Load aloe-ui deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALOE_UI_DEPLOY_KEY }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # Desktop control: xcap (screen capture) and enigo (input).
          sudo apt-get install -y libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libegl1-mesa-dev libgbm-dev libxdo-dev
          # Push-to-talk voice: cpal's microphone and speaker (ALSA).
          sudo apt-get install -y libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "aloe-desktop/src-tauri -> target"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install aloe-desktop dependencies
        working-directory: aloe-desktop
        run: bun install --frozen-lockfile

      # Desktop control's Cua Driver, bundled as a resource (src-tauri/src/cua.rs).
      - name: Fetch Cua Driver
        working-directory: aloe-desktop
        run: python scripts/fetch_cua_driver.py

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: aloe-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Aloe Desktop ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          # Generated above from the commit range; no one types release notes.
          releaseBody: ${{ steps.notes.outputs.body }}

          args: ${{ matrix.args }}
