<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aloe is listening</title>
    <style>
      /* One window over the display the pointer is on (see voice/overlay.rs): a glow around the
         edge, and an island that drops down from the top centre and grows to fit what Aloe says.
         The window is click-through except over the island. While Aloe uses the computer during
         a voice turn, the island carries that status and its Stop too. Excluded from Aloe's own
         screenshots. */
      :root {
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in: cubic-bezier(0.55, 0, 0.75, 0.2);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
        --moss: 200 243 106;
        --moss-deep: 11 13 12;
        --gold-rgb: 226 196 138;
        --tint: var(--moss);
        --cream: #ecebe4;
        --cream-soft: rgb(236 235 228 / 0.62);
        --gold: #ff7a4d;
        --surface: rgb(11 13 12 / 0.94);
        /* Text size from the voice preferences. */
        --scale: 1;
        color-scheme: dark;
      }
      [data-size="s"] { --scale: 0.9; }
      [data-size="l"] { --scale: 1.25; }
      [data-size="xl"] { --scale: 1.55; }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body { font: 400 14px/1.5 "Geist Variable", ui-sans-serif, system-ui, sans-serif; }
      #root { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; }
      [data-phase="asking"], [data-phase="error"] { --tint: var(--gold-rgb); }

      /* The edge glow. --bloom is set per frame from the smoothed voice level (or the phase's own
         rhythm), so it glides instead of stepping. */
      .glow { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 500ms var(--ease-out); --bloom: 0.25; }
      #root[data-open] .glow { opacity: 1; transition-duration: 300ms; }
      .glow::before, .glow::after { content: ""; position: absolute; inset: 0; transition: box-shadow 400ms var(--ease-out), opacity 600ms var(--ease-out); }
      .glow::before {
        box-shadow:
          inset 0 0 0 2px rgb(var(--tint) / 0.9),
          inset 0 0 0 3px rgb(var(--moss-deep) / 0.5),
          inset 0 0 36px 6px rgb(var(--tint) / 0.4);
      }
      /* Driving the computer: the full desktop-control ring, so it is never mistaken for listening. */
      #root[data-control] .glow::before {
        box-shadow:
          inset 0 0 0 3px rgb(var(--tint)),
          inset 0 0 0 4px rgb(var(--moss-deep) / 0.6),
          inset 0 0 40px 8px rgb(var(--tint) / 0.45);
      }
      .glow::after { box-shadow: inset 0 0 120px 30px rgb(var(--tint) / 0.55); opacity: var(--bloom); }
      [data-phase="done"] .glow::before { opacity: 0.4; }

      /* The island. The script springs its width and height to .inner's natural size; it drops in
         from above the screen and rises back out. */
      .island {
        position: fixed; top: 12px; left: 50%;
        width: 0; height: 0;
        border-radius: calc(18px * var(--scale));
        background: var(--surface);
        box-shadow: inset 0 0 0 1px rgb(var(--tint) / 0.35), 0 12px 32px rgb(0 0 0 / 0.4);
        -webkit-backdrop-filter: blur(20px) saturate(1.3);
        backdrop-filter: blur(20px) saturate(1.3);
        color: var(--cream);
        overflow: hidden;
        opacity: 0;
        transform: translate(-50%, calc(-100% - 24px)) scale(0.94);
        transform-origin: 50% 0;
        transition: transform 260ms var(--ease-in), opacity 200ms ease 60ms, box-shadow 300ms ease;
        will-change: transform, width, height;
      }
      #root[data-open] .island {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
        transition: transform 520ms var(--spring), opacity 160ms ease, box-shadow 300ms ease;
      }
      .inner {
        position: absolute; left: 0; top: 0;
        box-sizing: border-box;
        width: max-content;
        min-width: calc(200px * var(--scale));
        max-width: min(calc(340px * var(--scale)), calc(100vw - 32px));
        padding: calc(4px * var(--scale)) calc(4px * var(--scale)) calc(4px * var(--scale)) calc(6px * var(--scale));
      }
      #root[data-content] .inner { padding-bottom: calc(10px * var(--scale)); }

      .head { display: flex; align-items: center; gap: calc(8px * var(--scale)); height: calc(26px * var(--scale)); }
      .orb {
        position: relative; flex: none;
        width: calc(38px * var(--scale)); height: calc(22px * var(--scale));
        border-radius: 999px;
        background:
          radial-gradient(circle at 32% 28%, rgb(255 255 255 / 0.3), transparent 55%),
          radial-gradient(circle at 50% 60%, rgb(var(--tint)), rgb(var(--moss-deep)));
        box-shadow: 0 0 0 1px rgb(255 255 255 / 0.1), 0 0 calc(10px + var(--halo, 0) * 20px) rgb(var(--tint) / 0.5);
        transition: background 300ms ease;
      }
      .bars { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; }
      /* Thinking: a sheen sweeps around the orb. */
      .orb::before {
        content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0;
        background: conic-gradient(from var(--spin, 0deg), transparent 0 60%, rgb(255 255 255 / 0.45) 80%, transparent 95%);
        transition: opacity 300ms ease;
      }
      [data-phase="thinking"] .orb::before, [data-phase="transcribing"] .orb::before { opacity: 1; animation: spin 1.2s linear infinite; }
      @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
      @keyframes spin { to { --spin: 360deg; } }
      /* Asking: one ping, so the change is seen as well as heard. */
      .ring { position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 2px rgb(var(--gold-rgb)); opacity: 0; }
      [data-phase="asking"] .ring { animation: ping 900ms var(--ease-out) 1; }
      @keyframes ping { from { opacity: 0.9; transform: scale(1); } to { opacity: 0; transform: scale(1.9); } }
      [data-phase="error"] .orb { animation: shake 320ms var(--ease-in-out) 1; }
      @keyframes shake { 20% { translate: -3px 0; } 45% { translate: 3px 0; } 70% { translate: -2px 0; } 100% { translate: 0 0; } }

      .label { flex: 1; min-width: 0; font-weight: 500; font-size: calc(12px * var(--scale)); color: var(--cream-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .label.swap { animation: swap 220ms var(--ease-out) both; }
      @keyframes swap { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      [data-phase="thinking"] .label:not([data-control]) {
        background: linear-gradient(90deg, var(--cream-soft) 30%, var(--cream) 50%, var(--cream-soft) 70%) 0 0 / 300% 100%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: shimmer 1.6s linear infinite;
      }
      @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

      .stop, .close {
        flex: none; height: calc(22px * var(--scale)); padding: 0;
        border: 0; border-radius: 999px;
        font: inherit; font-size: calc(12px * var(--scale)); line-height: 1; color: var(--cream);
        cursor: pointer;
        transition: background-color 150ms ease, transform 120ms var(--ease-out), opacity 200ms ease;
      }
      .stop { display: none; padding: 0 calc(12px * var(--scale)); background: rgb(var(--gold-rgb) / 0.2); color: var(--gold); font-weight: 600; }
      #root[data-control] .stop { display: block; animation: swap 220ms var(--ease-out) both; }
      .close { width: calc(22px * var(--scale)); display: grid; place-items: center; background: rgb(244 247 240 / 0.08); color: var(--cream-soft); }
      .stop:active, .close:active { transform: scale(0.95); }
      .stop:focus-visible, .close:focus-visible { outline: 2px solid rgb(var(--tint)); outline-offset: 2px; }
      @media (hover: hover) and (pointer: fine) {
        .stop:hover { background: rgb(var(--gold-rgb) / 0.3); }
        .close:hover { background: rgb(244 247 240 / 0.16); color: var(--cream); }
      }

      /* Scrolls. The script keeps the word being spoken in view (or the newest text, once Aloe is
         quiet) unless the user has just scrolled; whichever edge has more text fades out. */
      .body {
        position: relative;
        display: flex; flex-direction: column; gap: 6px;
        max-height: calc(104px * var(--scale));
        overflow-x: hidden; overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: rgb(244 247 240 / 0.22) transparent;
        padding: 0 calc(6px * var(--scale));
      }
      #root:not([data-content]) .body { display: none; }
      #root[data-content] .body { margin-top: calc(4px * var(--scale)); }
      .body[data-clip-top] {
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 26px);
        mask-image: linear-gradient(to bottom, transparent 0, #000 26px);
      }
      .body[data-clip-bottom] {
        -webkit-mask-image: linear-gradient(to top, transparent 0, #000 26px);
        mask-image: linear-gradient(to top, transparent 0, #000 26px);
      }
      .body[data-clip-top][data-clip-bottom] {
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);
      }
      .said, .reply, .status, .error, .ask-text, .ask-hint { margin: 0; }
      .said, .reply { white-space: pre-wrap; overflow-wrap: anywhere; font-size: calc(13px * var(--scale)); line-height: 1.4; }
      .said { color: var(--cream); transition: font-size 260ms var(--ease-out), color 260ms ease; }
      .said:empty, .reply:empty, .status:empty, .error:empty { display: none; }
      /* Once Aloe answers, what you said steps back to a one-line caption. */
      #root[data-replied] .said { font-size: calc(11px * var(--scale)); color: var(--cream-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .reply { color: var(--cream); }
      /* The answer's Markdown and maths (voice-writing.ts builds it). */
      .reply .line { min-height: 1.4em; }
      .reply .gap { height: 0.5em; }
      .reply .h1, .reply .h2, .reply .h3 { font-weight: 650; margin-top: 0.15em; }
      .reply .h1 { font-size: 1.16em; }
      .reply .h2 { font-size: 1.08em; }
      .reply .item { position: relative; padding-left: 1.1em; }
      .reply .bullet { position: absolute; left: 0.15em; }
      .reply strong { font-weight: 650; }
      .reply code, .reply pre.code { font-family: "Geist Mono Variable", ui-monospace, monospace; font-size: 0.9em; background: rgb(244 247 240 / 0.1); border-radius: 0.3em; }
      .reply code { padding: 0.05em 0.3em; }
      .reply pre.code { margin: 0.3em 0; padding: 0.45em 0.6em; white-space: pre; overflow-x: auto; }
      .reply .tex.display { display: block; margin: 0.3em 0; overflow-x: auto; overflow-y: hidden; }
      .reply .katex { font-size: 1.06em; color: inherit; }
      .reply .katex-display { margin: 0; text-align: left; }
      .reply .katex-display > .katex { text-align: left; }
      .status { font-size: calc(12px * var(--scale)); color: var(--cream-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .error { font-size: calc(13px * var(--scale)); color: var(--gold); }

      /* New words fade in; a rewrite fades over. */
      .w { display: inline; animation: word 220ms var(--ease-out) both; }
      @keyframes word { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }
      .rewrite { animation: rewrite 160ms ease both; }
      @keyframes rewrite { from { opacity: 0.35; } to { opacity: 1; } }

      /* Read-along: while Aloe speaks, words not yet said are dimmed, said ones brighten, and a
         soft pill glides over the word being spoken. */
      .reply .wd {
        border-radius: 0.3em;
        -webkit-box-decoration-break: clone; box-decoration-break: clone;
        transition: color 280ms ease, background-color 280ms ease, box-shadow 280ms ease;
      }
      #root[data-reading] .reply .wd { color: rgb(244 247 240 / 0.45); }
      #root[data-reading] .reply .wd[data-said] { color: var(--cream); }
      #root[data-reading] .reply .wd[data-now] {
        color: var(--cream);
        background-color: rgb(var(--tint) / 0.26);
        box-shadow: 0 0 0 0.14em rgb(var(--tint) / 0.26);
      }

      /* Waiting for a spoken answer: the question, with numbered choices and what to say. */
      .ask { display: none; }
      [data-phase="asking"] .ask { display: block; }
      [data-phase="asking"] .reply { display: none; }
      .ask-text { font-size: calc(14px * var(--scale)); font-weight: 600; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
      .ask-options { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: option; }
      .ask-options:empty { display: none; }
      .ask-options li {
        counter-increment: option;
        padding: 3px 10px 3px 4px; border-radius: 999px;
        background: rgb(244 247 240 / 0.08); box-shadow: inset 0 0 0 1px rgb(244 247 240 / 0.14);
        font-size: calc(14px * var(--scale));
        animation: chip 280ms var(--spring) both;
      }
      .ask-options li::before {
        content: counter(option); display: inline-grid; place-items: center;
        min-width: 1.5em; height: 1.5em; margin-right: 6px; border-radius: 999px;
        background: rgb(var(--gold-rgb) / 0.2); color: var(--gold); font-weight: 600; font-size: 0.85em;
      }
      @keyframes chip { from { opacity: 0; transform: translateY(4px) scale(0.96); } to { opacity: 1; transform: none; } }
      .ask-hint { margin-top: 8px; font-size: calc(13px * var(--scale)); color: rgb(var(--moss)); font-weight: 600; }

      /* Marks Aloe draws over the screen (src/voice-drawing.ts). Under the island, never clickable
         except the clear chip. A soft shadow keeps them readable on light and dark content. Each
         piece is drawn on at its own --delay for its own --dur, set by the script from its length,
         with a pen tip (.pen) travelling along it, so marks appear as if drawn by hand. */
      :root { --ease-draw: cubic-bezier(0.45, 0.05, 0.3, 1); }
      .marks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
      .marks .mark { filter: drop-shadow(0 1px 1.5px rgb(0 0 0 / 0.45)); }
      .marks .marker { opacity: 0.38; filter: none; }
      .marks .wash { fill-opacity: 0.14; }
      .marks .dashed { stroke-dasharray: 0.02 0.015; }
      .mark.fresh .ink { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ink var(--dur, 520ms) var(--ease-draw) var(--delay) forwards; }
      .mark.fresh .marker { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: marker var(--dur, 420ms) var(--ease-draw) var(--delay) forwards; }
      .mark.fresh .fade { opacity: 0; animation: appear var(--dur, 220ms) ease var(--delay) forwards; }
      .mark.fresh .pop { opacity: 0; transform-box: fill-box; transform-origin: center; scale: 0; animation: pop 260ms var(--spring) var(--delay) forwards; }
      .mark.fresh .marker { opacity: 0.38; }
      @keyframes ink { to { stroke-dashoffset: 0; } }
      @keyframes marker { to { transform: scaleX(1); } }
      @keyframes appear { to { opacity: 1; } }
      @keyframes pop { to { opacity: 1; scale: 1; } }
      .notes { position: fixed; inset: 0; pointer-events: none; }
      .pen {
        position: absolute; left: 0; top: 0; width: 9px; height: 9px; border-radius: 50%;
        background: var(--accent); box-shadow: 0 0 0 2px rgb(255 255 255 / 0.6), 0 0 12px var(--accent);
        offset-anchor: center; offset-rotate: 0deg; offset-distance: 0%; opacity: 0;
        animation: pen var(--dur) var(--ease-draw) var(--delay) both;
      }
      @keyframes pen { 0% { offset-distance: 0%; opacity: 0; } 6% { opacity: 1; } 88% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
      /* Marks fade out together, with the answer they belong to. */
      .marks, .notes { transition: opacity 450ms var(--ease-out); }
      #root:not([data-marks]) .marks, #root:not([data-marks]) .notes { opacity: 0; }
      /* Handwriting (src/voice-writing.ts): Markdown and KaTeX in a marker hand, each word and
         formula wiped on left to right in turn (--d after the mark's --delay, for --t). Letters
         and digits in formulas are in the hand too; the symbols stay typeset. */
      .write {
        position: absolute; width: max-content;
        color: var(--accent);
        font: 500 34px/1.2 "Caveat", "Segoe Print", "Bradley Hand", cursive;
        overflow-wrap: anywhere;
        padding: 6px 14px 8px;
      }
      /* Writing and tags are ink straight on the page, with no backing, kept readable over anything
         by a firm halo tight round the letters: dark round coloured ink (it reads on light and dark
         pages alike), light round black ink. */
      .write, .note {
        --halo: rgb(10 11 14 / 0.92);
        filter: drop-shadow(0 0 1px var(--halo)) drop-shadow(0 0 1px var(--halo)) drop-shadow(0 0 2.5px var(--halo)) drop-shadow(0 1px 5px rgb(0 0 0 / 0.35));
      }
      .write[data-paper="light"], .note[data-paper="light"] { --halo: rgb(255 255 255 / 0.95); }
      .write.small { font-size: 28px; font-weight: 600; }
      .write.large { font-size: 46px; }
      .write .line { min-height: 1.2em; }
      .write .gap { height: 0.45em; }
      .write .h1 { font-size: 1.5em; font-weight: 700; line-height: 1.1; }
      .write .h2 { font-size: 1.28em; font-weight: 700; }
      .write .h3 { font-size: 1.1em; font-weight: 700; }
      .write .item { position: relative; padding-left: 1.15em; }
      .write .bullet { position: absolute; left: 0.1em; }
      .write strong { font-weight: 700; }
      .write code { font: 0.62em/1.3 "Geist Mono Variable", ui-monospace, monospace; padding: 0.05em 0.35em; border-radius: 0.3em; background: rgb(127 127 127 / 0.22); }
      .write .wd { display: inline-block; }
      .write .tex.display { display: block; margin: 0.12em 0; }
      .write .katex { font-family: "Caveat", KaTeX_Main, "Times New Roman", serif; font-size: 0.96em; }
      .write .katex .mathnormal { font-family: "Caveat", KaTeX_Math, serif; font-style: normal; }
      .write .katex-display { margin: 0; text-align: left; }
      .write .katex-display > .katex { text-align: left; }
      /* --pace (set per note, 1 or less) speeds a big batch up to finish on time; see voice-drawing.ts. */
      .write.fresh .wd { clip-path: inset(-25% 100% -25% -8%); animation: write calc(var(--t) * var(--pace, 1)) linear calc(var(--delay) + var(--d) * var(--pace, 1)) forwards; }
      @keyframes write { to { clip-path: inset(-25% -8% -25% -8%); } }
      /* Labels and tags: written in the same hand as the notes, in the mark's ink, on the same
         backing (above). */
      .note {
        position: absolute; transform: translate(-50%, -50%);
        max-width: 300px; width: max-content;
        color: var(--accent);
        font: 600 28px/1.05 "Caveat", "Segoe Print", "Bradley Hand", cursive;
        text-align: center; overflow-wrap: anywhere;
        padding: 1px 12px 4px;
      }
      /* A tag with maths: the parser's lines sit inline, at the tag's own size, in the hand. */
      .note .line { display: inline; }
      .note .katex { font-family: "Caveat", KaTeX_Main, "Times New Roman", serif; font-size: 0.96em; }
      .note .katex .mathnormal { font-family: "Caveat", KaTeX_Math, serif; font-style: normal; }
      .note.small { font-size: 25px; }
      .note.large { font-size: 36px; }
      .note.fresh { clip-path: inset(-25% 100% -25% -8%); animation: write calc(380ms * var(--pace, 1)) linear var(--delay) forwards; }
      .clear-marks {
        position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 16px);
        display: flex; align-items: center; gap: 8px;
        padding: 7px 14px; border: 0; border-radius: 999px;
        background: var(--surface); color: var(--cream); box-shadow: inset 0 0 0 1px rgb(var(--moss) / 0.35), 0 8px 24px rgb(0 0 0 / 0.4);
        font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
        opacity: 0; pointer-events: none;
        transition: opacity 200ms ease, transform 260ms var(--ease-out), background-color 150ms ease;
      }
      .clear-marks kbd { font: inherit; font-size: 11px; color: var(--cream-soft); padding: 1px 6px; border-radius: 5px; background: rgb(244 247 240 / 0.1); }
      #root[data-marks] .clear-marks { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
      .clear-marks:active { transform: translate(-50%, 0) scale(0.96); }
      @media (hover: hover) and (pointer: fine) { .clear-marks:hover { background: rgb(39 39 42 / 0.96); } }
      /* High contrast keeps solid tags: black, white type, a thick edge in the mark's colour. */
      [data-contrast="high"] .note {
        padding: 4px 10px; border-radius: 8px; filter: none; clip-path: none; animation: none;
        background: #000; color: #fff; box-shadow: inset 0 0 0 3px var(--accent);
        font: 700 16px/1.3 system-ui, sans-serif;
      }
      [data-contrast="high"] .clear-marks { background: #000; box-shadow: inset 0 0 0 2px #ffd400; }

      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

      /* High contrast: solid black, white text, a thick yellow edge; nothing translucent. */
      [data-contrast="high"] {
        --cream: #ffffff;
        --cream-soft: #e8e8e8;
        --gold: #ffd400;
        --gold-rgb: 255 212 0;
        --moss: 255 212 0;
        --moss-deep: 0 0 0;
        --surface: #000;
      }
      [data-contrast="high"] .island { box-shadow: inset 0 0 0 3px #ffd400; -webkit-backdrop-filter: none; backdrop-filter: none; }
      [data-contrast="high"] .body { -webkit-mask-image: none !important; mask-image: none !important; scrollbar-color: #fff #000; }
      [data-contrast="high"] #root[data-reading] .reply .wd[data-now] { background-color: #ffd400; box-shadow: 0 0 0 0.14em #ffd400; color: #000; }
      [data-contrast="high"] .orb { background: #000; box-shadow: 0 0 0 2px #ffd400; }
      [data-contrast="high"] .orb::before { display: none; }
      [data-contrast="high"] [data-phase="thinking"] .label, [data-contrast="high"] .label { animation: none; background: none; color: var(--cream); }
      [data-contrast="high"] .stop { background: #ffd400; color: #000; }
      [data-contrast="high"] .close { background: #000; box-shadow: inset 0 0 0 2px #fff; color: #fff; }
      [data-contrast="high"] .ask-options li { background: #000; box-shadow: inset 0 0 0 2px #fff; }

      @media (prefers-reduced-motion: reduce) {
        .island, #root[data-open] .island { transform: translate(-50%, 0); transition: opacity 160ms linear; }
        .orb::before, .ring, [data-phase="error"] .orb, .label, .w, .rewrite, .ask-options li, #root[data-control] .stop { animation: none !important; }
        .reply .wd { transition: none; }
        .clear-marks { transition: opacity 160ms linear; }
        .pen { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root" data-phase="idle">
      <div class="glow" id="glow" aria-hidden="true"></div>
      <svg class="marks" id="marks" aria-hidden="true"></svg>
      <div class="notes" id="notes" aria-hidden="true"></div>
      <button type="button" class="clear-marks" id="clear-marks">Clear marks <kbd>Esc</kbd></button>
      <div class="island" id="island">
        <div class="inner" id="inner">
          <div class="head">
            <div class="orb" id="orb" aria-hidden="true">
              <canvas class="bars" id="bars"></canvas>
              <span class="ring"></span>
            </div>
            <span class="label" id="label" aria-hidden="true"></span>
            <button type="button" class="stop" id="stop">Stop</button>
            <button type="button" class="close" id="close" aria-label="Close">✕</button>
          </div>
          <div class="body" id="body" aria-hidden="true">
            <p class="said" id="said"></p>
            <div class="ask">
              <p class="ask-text" id="ask-text"></p>
              <ol class="ask-options" id="ask-options"></ol>
              <p class="ask-hint" id="ask-hint"></p>
            </div>
            <div class="reply" id="reply"></div>
            <p class="status" id="status"></p>
            <p class="error" id="error"></p>
          </div>
        </div>
      </div>
      <!-- What a screen reader hears: whole sentences, not each word as it lands. -->
      <div class="sr" id="live" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/voice-overlay.ts"></script>
  </body>
</html>
