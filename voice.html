<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aloe is listening</title>
    <style>
      /* One window over the display the pointer is on (see voice/overlay.rs): a glow around the
         edge, and an island that drops down from the top centre and grows to fit what Aloe says.
         The window is click-through except over the island. While Aloe uses the computer during
         a voice turn, the island carries that status and its Stop too. Excluded from Aloe's own
         screenshots. */
      :root {
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in: cubic-bezier(0.55, 0, 0.75, 0.2);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
        --moss: 123 189 150; /* --moss, dark theme */
        --moss-deep: 47 107 79; /* --moss, light theme */
        --gold-rgb: 226 196 138;
        --tint: var(--moss);
        --cream: #f4f7f0;
        --cream-soft: rgb(244 247 240 / 0.62);
        --gold: #e2c48a;
        --surface: rgb(12 17 14 / 0.92);
        /* Text size from the voice preferences. */
        --scale: 1;
        color-scheme: dark;
      }
      [data-size="s"] { --scale: 0.9; }
      [data-size="l"] { --scale: 1.25; }
      [data-size="xl"] { --scale: 1.55; }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body { font: 400 14px/1.5 "Instrument Sans Variable", system-ui, -apple-system, "Segoe UI", sans-serif; }
      #root { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; }
      [data-phase="asking"], [data-phase="error"] { --tint: var(--gold-rgb); }

      /* The edge glow. --bloom is set per frame from the smoothed voice level (or the phase's own
         rhythm), so it glides instead of stepping. */
      .glow { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 500ms var(--ease-out); --bloom: 0.25; }
      #root[data-open] .glow { opacity: 1; transition-duration: 300ms; }
      .glow::before, .glow::after { content: ""; position: absolute; inset: 0; transition: box-shadow 400ms var(--ease-out), opacity 600ms var(--ease-out); }
      .glow::before {
        box-shadow:
          inset 0 0 0 2px rgb(var(--tint) / 0.9),
          inset 0 0 0 3px rgb(var(--moss-deep) / 0.5),
          inset 0 0 36px 6px rgb(var(--tint) / 0.4);
      }
      /* Driving the computer: the full desktop-control ring, so it is never mistaken for listening. */
      #root[data-control] .glow::before {
        box-shadow:
          inset 0 0 0 3px rgb(var(--tint)),
          inset 0 0 0 4px rgb(var(--moss-deep) / 0.6),
          inset 0 0 40px 8px rgb(var(--tint) / 0.45);
      }
      .glow::after { box-shadow: inset 0 0 120px 30px rgb(var(--tint) / 0.55); opacity: var(--bloom); }
      [data-phase="done"] .glow::before { opacity: 0.4; }

      /* The island. The script springs its width and height to .inner's natural size; it drops in
         from above the screen and rises back out. */
      .island {
        position: fixed; top: 12px; left: 50%;
        width: 0; height: 0;
        border-radius: calc(22px * var(--scale));
        background: var(--surface);
        box-shadow: inset 0 0 0 1px rgb(var(--tint) / 0.35), 0 12px 32px rgb(0 0 0 / 0.4);
        -webkit-backdrop-filter: blur(20px) saturate(1.3);
        backdrop-filter: blur(20px) saturate(1.3);
        color: var(--cream);
        overflow: hidden;
        opacity: 0;
        transform: translate(-50%, calc(-100% - 24px)) scale(0.94);
        transform-origin: 50% 0;
        transition: transform 260ms var(--ease-in), opacity 200ms ease 60ms, box-shadow 300ms ease;
        will-change: transform, width, height;
      }
      #root[data-open] .island {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
        transition: transform 520ms var(--spring), opacity 160ms ease, box-shadow 300ms ease;
      }
      .inner {
        position: absolute; left: 0; top: 0;
        box-sizing: border-box;
        width: max-content;
        min-width: calc(232px * var(--scale));
        max-width: min(calc(440px * var(--scale)), calc(100vw - 32px));
        padding: calc(6px * var(--scale)) calc(6px * var(--scale)) calc(6px * var(--scale)) calc(8px * var(--scale));
      }
      #root[data-content] .inner { padding-bottom: calc(14px * var(--scale)); }

      .head { display: flex; align-items: center; gap: calc(10px * var(--scale)); height: calc(32px * var(--scale)); }
      .orb {
        position: relative; flex: none;
        width: calc(48px * var(--scale)); height: calc(28px * var(--scale));
        border-radius: 999px;
        background:
          radial-gradient(circle at 32% 28%, rgb(255 255 255 / 0.3), transparent 55%),
          radial-gradient(circle at 50% 60%, rgb(var(--tint)), rgb(var(--moss-deep)));
        box-shadow: 0 0 0 1px rgb(255 255 255 / 0.1), 0 0 calc(10px + var(--halo, 0) * 20px) rgb(var(--tint) / 0.5);
        transition: background 300ms ease;
      }
      .bars { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; }
      /* Thinking: a sheen sweeps around the orb. */
      .orb::before {
        content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0;
        background: conic-gradient(from var(--spin, 0deg), transparent 0 60%, rgb(255 255 255 / 0.45) 80%, transparent 95%);
        transition: opacity 300ms ease;
      }
      [data-phase="thinking"] .orb::before, [data-phase="transcribing"] .orb::before { opacity: 1; animation: spin 1.2s linear infinite; }
      @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
      @keyframes spin { to { --spin: 360deg; } }
      /* Asking: one ping, so the change is seen as well as heard. */
      .ring { position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 2px rgb(var(--gold-rgb)); opacity: 0; }
      [data-phase="asking"] .ring { animation: ping 900ms var(--ease-out) 1; }
      @keyframes ping { from { opacity: 0.9; transform: scale(1); } to { opacity: 0; transform: scale(1.9); } }
      [data-phase="error"] .orb { animation: shake 320ms var(--ease-in-out) 1; }
      @keyframes shake { 20% { translate: -3px 0; } 45% { translate: 3px 0; } 70% { translate: -2px 0; } 100% { translate: 0 0; } }

      .label { flex: 1; min-width: 0; font-weight: 500; font-size: calc(13px * var(--scale)); color: var(--cream-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .label.swap { animation: swap 220ms var(--ease-out) both; }
      @keyframes swap { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      [data-phase="thinking"] .label:not([data-control]) {
        background: linear-gradient(90deg, var(--cream-soft) 30%, var(--cream) 50%, var(--cream-soft) 70%) 0 0 / 300% 100%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: shimmer 1.6s linear infinite;
      }
      @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

      .stop, .close {
        flex: none; height: calc(28px * var(--scale)); padding: 0;
        border: 0; border-radius: 999px;
        font: inherit; font-size: calc(13px * var(--scale)); line-height: 1; color: var(--cream);
        cursor: pointer;
        transition: background-color 150ms ease, transform 120ms var(--ease-out), opacity 200ms ease;
      }
      .stop { display: none; padding: 0 calc(12px * var(--scale)); background: rgb(var(--gold-rgb) / 0.2); color: var(--gold); font-weight: 600; }
      #root[data-control] .stop { display: block; animation: swap 220ms var(--ease-out) both; }
      .close { width: calc(28px * var(--scale)); display: grid; place-items: center; background: rgb(244 247 240 / 0.08); color: var(--cream-soft); }
      .stop:active, .close:active { transform: scale(0.95); }
      .stop:focus-visible, .close:focus-visible { outline: 2px solid rgb(var(--tint)); outline-offset: 2px; }
      @media (hover: hover) and (pointer: fine) {
        .stop:hover { background: rgb(var(--gold-rgb) / 0.3); }
        .close:hover { background: rgb(244 247 240 / 0.16); color: var(--cream); }
      }

      /* Newest text at the bottom; older lines fade out at the top rather than scroll. */
      .body {
        display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
        max-height: calc(200px * var(--scale));
        overflow: hidden;
        padding: 0 calc(8px * var(--scale));
      }
      #root:not([data-content]) .body { display: none; }
      #root[data-content] .body { margin-top: calc(8px * var(--scale)); }
      .body[data-clipped] {
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 26px);
        mask-image: linear-gradient(to bottom, transparent 0, #000 26px);
      }
      .said, .reply, .status, .error, .ask-text, .ask-hint { margin: 0; }
      .said, .reply { white-space: pre-wrap; overflow-wrap: anywhere; font-size: calc(15px * var(--scale)); }
      .said { color: var(--cream); transition: font-size 260ms var(--ease-out), color 260ms ease; }
      .said:empty, .reply:empty, .status:empty, .error:empty { display: none; }
      /* Once Aloe answers, what you said steps back to a one-line caption. */
      #root[data-replied] .said { font-size: calc(12px * var(--scale)); color: var(--cream-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .reply { color: var(--cream); }
      .status { font-size: calc(12px * var(--scale)); color: var(--cream-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .error { font-size: calc(13px * var(--scale)); color: var(--gold); }

      /* New words fade in; a rewrite fades over. */
      .w { display: inline; animation: word 220ms var(--ease-out) both; }
      @keyframes word { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }
      .rewrite { animation: rewrite 160ms ease both; }
      @keyframes rewrite { from { opacity: 0.35; } to { opacity: 1; } }

      /* Waiting for a spoken answer: the question, with numbered choices and what to say. */
      .ask { display: none; }
      [data-phase="asking"] .ask { display: block; }
      [data-phase="asking"] .reply { display: none; }
      .ask-text { font-size: calc(16px * var(--scale)); font-weight: 600; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
      .ask-options { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: option; }
      .ask-options:empty { display: none; }
      .ask-options li {
        counter-increment: option;
        padding: 3px 10px 3px 4px; border-radius: 999px;
        background: rgb(244 247 240 / 0.08); box-shadow: inset 0 0 0 1px rgb(244 247 240 / 0.14);
        font-size: calc(14px * var(--scale));
        animation: chip 280ms var(--spring) both;
      }
      .ask-options li::before {
        content: counter(option); display: inline-grid; place-items: center;
        min-width: 1.5em; height: 1.5em; margin-right: 6px; border-radius: 999px;
        background: rgb(var(--gold-rgb) / 0.2); color: var(--gold); font-weight: 600; font-size: 0.85em;
      }
      @keyframes chip { from { opacity: 0; transform: translateY(4px) scale(0.96); } to { opacity: 1; transform: none; } }
      .ask-hint { margin-top: 8px; font-size: calc(13px * var(--scale)); color: rgb(var(--moss)); font-weight: 600; }

      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

      /* High contrast: solid black, white text, a thick yellow edge; nothing translucent. */
      [data-contrast="high"] {
        --cream: #ffffff;
        --cream-soft: #e8e8e8;
        --gold: #ffd400;
        --gold-rgb: 255 212 0;
        --moss: 255 212 0;
        --moss-deep: 0 0 0;
        --surface: #000;
      }
      [data-contrast="high"] .island { box-shadow: inset 0 0 0 3px #ffd400; -webkit-backdrop-filter: none; backdrop-filter: none; }
      [data-contrast="high"] .body { -webkit-mask-image: none; mask-image: none; }
      [data-contrast="high"] .orb { background: #000; box-shadow: 0 0 0 2px #ffd400; }
      [data-contrast="high"] .orb::before { display: none; }
      [data-contrast="high"] [data-phase="thinking"] .label, [data-contrast="high"] .label { animation: none; background: none; color: var(--cream); }
      [data-contrast="high"] .stop { background: #ffd400; color: #000; }
      [data-contrast="high"] .close { background: #000; box-shadow: inset 0 0 0 2px #fff; color: #fff; }
      [data-contrast="high"] .ask-options li { background: #000; box-shadow: inset 0 0 0 2px #fff; }

      @media (prefers-reduced-motion: reduce) {
        .island, #root[data-open] .island { transform: translate(-50%, 0); transition: opacity 160ms linear; }
        .orb::before, .ring, [data-phase="error"] .orb, .label, .w, .rewrite, .ask-options li, #root[data-control] .stop { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root" data-phase="idle">
      <div class="glow" id="glow" aria-hidden="true"></div>
      <div class="island" id="island">
        <div class="inner" id="inner">
          <div class="head">
            <div class="orb" id="orb" aria-hidden="true">
              <canvas class="bars" id="bars"></canvas>
              <span class="ring"></span>
            </div>
            <span class="label" id="label" aria-hidden="true"></span>
            <button type="button" class="stop" id="stop">Stop</button>
            <button type="button" class="close" id="close" aria-label="Close">✕</button>
          </div>
          <div class="body" id="body" aria-hidden="true">
            <p class="said" id="said"></p>
            <div class="ask">
              <p class="ask-text" id="ask-text"></p>
              <ol class="ask-options" id="ask-options"></ol>
              <p class="ask-hint" id="ask-hint"></p>
            </div>
            <p class="reply" id="reply"></p>
            <p class="status" id="status"></p>
            <p class="error" id="error"></p>
          </div>
        </div>
      </div>
      <!-- What a screen reader hears: whole sentences, not each word as it lands. -->
      <div class="sr" id="live" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/voice-overlay.ts"></script>
  </body>
</html>
