[package]
name = "aloe-desktop"
version = "1.4.14"
description = "Aloe Desktop local agent"
authors = ["Aloe"]
edition = "2021"

[lib]
name = "aloe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# macos-private-api: transparent windows on macOS, for the desktop-control overlay (overlay.rs).
tauri = { version = "2", features = ["tray-icon", "devtools", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
url = "2"
notify-rust = "4.18"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
# Aloe Code's glob/grep (code_tools.rs): ripgrep's own walker and glob matcher, so .gitignore is honoured.
ignore = "0.4"
globset = "0.4"
base64 = "0.22"
# Desktop control (computer.rs): synthetic mouse/keyboard input and primary-display capture.
enigo = "0.2"
xcap = "0.0.12"
# png: Cua Driver returns PNG screenshots, re-encoded as JPEG before they go to the model (cua.rs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Push-to-talk voice (voice/): microphone capture and playback of Aloe's spoken reply.
cpal = "0.18"

# The green pointer while Aloe is in control (cursor.rs): swaps the system cursor on Windows.
# Also the push-to-talk keyboard hook (voice/hotkey.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

# Reduced debug info to keep dev-build artifacts smaller (this machine runs low on disk
# during iterative `tauri dev` rebuilds).
[profile.dev]
debug = "line-tables-only"
